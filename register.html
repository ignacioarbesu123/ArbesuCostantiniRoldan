<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
   <header class="headerhome">
        <a href="./index.html"><img class="logo" src="./img/logo.jpeg" alt="logo de la pagina"></a>
        <form class="buscador" action="" method="get"> 
            <input type="text" name="búsqueda" value="">
            <button type="submit">Buscar</button>
        </form>
        <nav class="loginregister">
            <a href="./index.html">Home</a>
            <a href="./login.html">Login</a>
            <a href="./register.html">Register</a>
        </nav>
    </header>

    <form class="register" action="./login.html" method="get">
        
        <div class="form">
          <label for="nombre">nombre:</label>
          <input id="nombre" type="text" name="user" value="">
        </div>
        
        <div class="form"> 
          <label for="mail">mail:</label>
          <input id="mail" type="mail" name="mail" value="">
        </div>
        
        <div class="form">
          <label for="contraseña">contraseña:</label>
          <input id="contraseña" type="password" name="pass" value="">
        </div>

       <div class="form">
          <label for="repetir contraseña">Repetir contraseña:</label>
          <input id="repetir contraseña" type="password" name="pass" value="">
        </div>  

        <div class="form">
          <label for="terminos">Acepto términos y condiciones</label>
          <input id="terminos" type="checkbox" name="terminos" required>
        </div> 

        <div>
          <a href="./login.html">Ya tengo cuenta</a>
        </div>

        <div>
            <button type="submit">Registrarme</button>
        </div>
    </form>
</body>
</html>
